<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            display: flex;
            flex-grow: 1;
        }

        .container div {
            background-color: lightblue;
        }

        section p:nth-child(2) {
            color: red;
        }
    </style>
</head>
<body>
   
    <section>
        <h2>A</h2>
        <p>B</p>
        <p>C</p>
        <div>
            <p>D</p>
            <p>E <span>F</span></p>
        </div>
    </section>
</div>
</body>
</html>
